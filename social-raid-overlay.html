<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Weltenclicker Raid Overlay</title>
  <link rel="stylesheet" href="/social-raid-overlay.css">
</head>
<body>
  <main class="overlay">
    <div id="state" class="label">COMMUNITY VS COMMUNITY · VERBINDE …</div>
    <div class="teams">
      <section><span id="emblemA" class="emblem purple">A</span><strong id="nameA">TEAM A</strong><small id="codeA"></small><b id="scoreA">0</b></section>
      <div class="center"><span>⚔</span><strong id="time">--:--</strong><small>RAID</small></div>
      <section><span id="emblemB" class="emblem red">B</span><strong id="nameB">TEAM B</strong><small id="codeB"></small><b id="scoreB">0</b></section>
    </div>
    <div class="meter"><i id="meter"></i></div>
    <div id="lead" class="lead"></div>
  </main>
  <script src="/config.js"></script>
  <script src="/social-raid-overlay.js"></script>
</body>
</html>
