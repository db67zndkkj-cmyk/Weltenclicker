<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Weltenclicker Social Hub – Feed, Communities, Raids, Creator Hub und Nachrichten">
  <title>Weltenclicker Social</title>
  <link rel="preconnect" href="https://dadrajxjjzitwobmwvgy.supabase.co" crossorigin>
  <link rel="preload" href="/social.js" as="script">
  <link rel="stylesheet" href="/social.css">
</head>
<body>
  <a class="skip" href="#socialMain">Zum Inhalt springen</a>
  <div class="beta-bar">WELTENCLICKER SOCIAL · BETA · ECHTE SOCIAL-DATEN · TWITCH-VERIFIZIERUNG FOLGT</div>

  <div class="social-shell">
    <aside class="left-rail">
      <a class="brand" href="/"><span class="brand-orb">◉</span><span>WELTEN<b>CLICKER</b></span></a>
      <nav class="main-nav" aria-label="Social Navigation">
        <button data-view="home" class="nav-item active"><span>⌂</span><b>Home</b></button>
        <button data-view="explore" class="nav-item"><span>⌕</span><b>Entdecken</b></button>
        <button data-view="raids" class="nav-item"><span>⚔</span><b>Raids</b></button>
        <button data-view="communities" class="nav-item"><span>◎</span><b>Communities</b></button>
        <button data-view="notifications" class="nav-item"><span>◇</span><b>Aktivität</b><em id="notificationBadge" hidden>0</em></button>
        <button data-view="messages" class="nav-item"><span>✉</span><b>Nachrichten</b></button>
        <button data-view="creator" class="nav-item creator-link"><span>▣</span><b>Creator Hub</b></button>
      </nav>
      <button id="newPostButton" class="new-post">+ POST ERSTELLEN</button>
      <button id="accountMini" class="account-mini">
        <span id="accountAvatar" class="avatar">?</span>
        <span><strong id="accountName">Lädt …</strong><small id="accountHandle"></small></span>
        <i>•••</i>
      </button>
    </aside>

    <main id="socialMain" class="main-column">
      <header class="mobile-top">
        <a class="brand compact" href="/"><span class="brand-orb">◉</span><span>WELTEN<b>CLICKER</b></span></a>
        <button id="mobilePost" class="icon-button">＋</button>
      </header>
      <div id="page" aria-live="polite"></div>
    </main>

    <aside class="right-rail">
      <section class="card global-card">
        <div class="card-kicker"><span>GLOBALE WELTEN</span><b id="globalLiveState">● LIVE</b></div>
        <strong id="globalWorlds">Lädt …</strong>
        <button id="globalClickButton" class="global-click" disabled>+1 WELT</button>
        <small id="globalGameInfo">Verbindung wird hergestellt …</small>
      </section>

      <label class="side-search"><span>⌕</span><input id="globalSearch" placeholder="Social durchsuchen"></label>

      <section class="card side-card">
        <div class="section-head"><h3>Top Communities</h3><button data-view="communities">Alle</button></div>
        <div id="sideCommunities" class="side-list"></div>
      </section>

      <section class="card side-card">
        <div class="section-head"><h3>Creator entdecken</h3><button data-view="explore">Mehr</button></div>
        <div id="sideCreators" class="side-list"></div>
      </section>

      <footer class="side-footer">
        <a href="/agb.html">AGB</a><a href="/datenschutz.html">Datenschutz</a><a href="/impressum.html">Impressum</a><a href="/">Spiel</a>
      </footer>
    </aside>
  </div>

  <nav class="mobile-nav" aria-label="Mobile Navigation">
    <button data-view="home" class="active">⌂<span>Home</span></button>
    <button data-view="explore">⌕<span>Suche</span></button>
    <button data-view="raids">⚔<span>Raids</span></button>
    <button data-view="communities">◎<span>Teams</span></button>
    <button data-view="messages">✉<span>DMs</span></button>
  </nav>

  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <section class="modal-panel card" role="dialog" aria-modal="true">
      <button class="modal-close" data-close-modal aria-label="Schließen">×</button>
      <div id="modalBody"></div>
    </section>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <script src="/config.js"></script>
  <script src="/social.js"></script>
</body>
</html>
